name: Deploy SwiftPay

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar credenciales AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::571179239055:role/GitHubActionsSwiftPayRole
          aws-region: us-east-1

      - name: Instalar y Compilar (Vite/Vue)
        run: |
          npm install
          npm run build

      - name: Subir archivos compilados a S3
        run: |
          aws s3 sync dist/ s3://swiftpay-frontend-app --delete

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: latest

      - name: Terraform Init
        run: |
          cd terraform
          terraform init

      - name: Terraform Plan
        run: |
          cd terraform
          terraform plan -out=tfplan

      - name: Terraform Apply
        run: |
          cd terraform
          terraform apply tfplan
